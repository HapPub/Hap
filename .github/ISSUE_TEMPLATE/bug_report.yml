name: Bug report
description: Report a reproducible HapCLI problem without private project or device data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, real device identifiers, UDIDs, LAN endpoints, and local absolute paths before submitting.
  - type: input
    id: version
    attributes:
      label: HapCLI version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Platform and toolchain versions
      placeholder: macOS 14, Cangjie 1.1.3, cjpm 1.1.3
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest synthetic project or fixture that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I removed credentials, tokens, personal device identifiers, LAN endpoints, and private project paths.
          required: true
