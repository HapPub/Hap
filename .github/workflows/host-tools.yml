name: Host tools
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    paths: ['src/**', 'tools/**', 'tests/**', 'scripts/**', 'cjpm.toml', '.github/workflows/host-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            sdk: linux-x64
          - runner: macos-14
            sdk: mac-aarch64
          - runner: windows-2025
            sdk: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bootstrap fixed Cangjie toolchain
        shell: bash
        run: |
          bash scripts/ci/bootstrap-cangjie-from-mirror.sh \
            https://github.com/HapPub/CangjieSDK-Mirror/releases/download/1.1.3/manifest.v1.json \
            '${{ matrix.sdk }}' "$RUNNER_TEMP/cangjie" "$RUNNER_TEMP/cangjie-env.sh" "$RUNNER_TEMP/sdk.json"
      - name: Build and verify command entrypoints
        id: build
        shell: bash
        run: |
          set +u
          source "$RUNNER_TEMP/cangjie-env.sh"
          set -u
          if [[ "$RUNNER_OS" == macOS ]]; then export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"; fi
          python3 scripts/embed-host-tools.py --check
          cjpm build
          cjpm test --timeout-each=30s --no-progress --no-color
          if [[ "$RUNNER_OS" == Windows ]]; then
            python3 tests/host-contracts.py target/release/bin/main.exe
            python3 tests/host-tools.py target/release/bin/main.exe
            target/release/bin/main.exe get ssh --plan
            target/release/bin/main.exe get ssh
            target/release/bin/main.exe get nsis --version 3.12 --sha256 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --plan
            target/release/bin/main.exe ssh doctor
          else
            python3 tests/host-contracts.py target/release/bin/main
            python3 tests/host-tools.py target/release/bin/main
            if [[ "$RUNNER_OS" == macOS ]]; then python3 tests/ssh-session.py target/release/bin/main; fi
          fi
      - name: Verify native Windows Semeru installation
        if: runner.os == 'Windows' && !cancelled()
        shell: bash
        run: |
          set +u
          source "$RUNNER_TEMP/cangjie-env.sh"
          set -u
          python3 tests/windows-jdk.py target/release/bin/main.exe
      - name: Validate Windows desktop helper syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens=$null; $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/windows/desktop-session.ps1'),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
