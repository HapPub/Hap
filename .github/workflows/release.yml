name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - fix/windows-build-dual-releases
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      sdk_versions: ${{ steps.release.outputs.sdk_versions }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: release
        name: Validate source version, tag and public surface
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/HapCliVersion: String/ {print $2; exit}' src/hapcli.cj)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$(bash scripts/ci/validate-release.sh "$GITHUB_REF_NAME")"
            case "$GITHUB_REF_NAME" in
              *-cangjie-1.0.5) sdk_versions='["1.0.5"]' ;;
              *) sdk_versions='["1.1.3"]' ;;
            esac
          else
            bash scripts/ci/validate-release.sh "v$version"
            sdk_versions='["1.0.5","1.1.3"]'
          fi
          printf 'version=%s\nsdk_versions=%s\n' "$version" "$sdk_versions" >> "$GITHUB_OUTPUT"
          sh tests/public-surface.sh
          sh tests/hapup-security.sh
          python3 tests/hapup-install.py
          python3 tests/hapup-download.py
          sh tests/release-workflow.sh
          sh tests/nightly-workflow.sh
          python3 tests/toolchain-release.py

  source:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Package source fallback
        run: bash scripts/ci/package-source.sh "${{ needs.validate.outputs.version }}" dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-source
          path: dist/*
          if-no-files-found: error

  native:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        sdk_version: ${{ fromJSON(needs.validate.outputs.sdk_versions) }}
        host:
          - runner: ubuntu-24.04
            target: linux-amd64
            sdk_platform: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            sdk_platform: linux-aarch64
          - runner: macos-14
            target: darwin-arm64
            sdk_platform: mac-aarch64
          - runner: windows-2025
            target: windows-amd64
            sdk_platform: windows-x64
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Linux native build tools
        if: startsWith(matrix.host.target, 'linux-')
        shell: bash
        run: |
          command -v ar
          command -v ld
      - name: Install checksum-pinned Cangjie SDK
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then python_cmd=python3; else python_cmd=python; fi
          printf 'PYTHON=%s\n' "$python_cmd" >> "$GITHUB_ENV"
          PYTHON="$python_cmd" bash scripts/ci/bootstrap-cangjie-from-mirror.sh \
            'https://github.com/HapPub/CangjieSDK-Mirror/releases/download/${{ matrix.sdk_version }}/manifest.v1.json' \
            '${{ matrix.host.sdk_platform }}' \
            "$RUNNER_TEMP/cangjie-sdk" "$RUNNER_TEMP/cangjie-env.sh" \
            "$RUNNER_TEMP/cangjie-sdk-resolution.json"
      - name: Build, test, and package native binary
        env:
          HAP_EXPECTED_SDK_VERSION: ${{ matrix.sdk_version }}
        shell: bash
        run: |
          bash scripts/ci/build-release.sh \
            '${{ matrix.host.target }}' '${{ needs.validate.outputs.version }}' \
            "$RUNNER_TEMP/cangjie-env.sh" dist
          cp "$RUNNER_TEMP/cangjie-sdk-resolution.json" \
            "dist/hap-${{ needs.validate.outputs.version }}-${{ matrix.host.target }}.cangjie-sdk-resolution.json"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-${{ matrix.sdk_version }}-${{ matrix.host.target }}
          path: dist/*
          if-no-files-found: error
      - name: Retain build diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: diagnostics-${{ matrix.sdk_version }}-${{ matrix.host.target }}
          path: ${{ runner.temp }}/hap-release-*.log
          if-no-files-found: ignore

  publish:
    needs: [validate, source, native]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-${{ fromJSON(needs.validate.outputs.sdk_versions)[0] }}-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-source
          path: dist
      - name: Build manifest from verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp release/hapup.sh dist/hapup.sh
          chmod 0755 dist/hapup.sh
          python3 scripts/ci/render-release-manifest.py \
            --dist dist --version '${{ needs.validate.outputs.version }}' \
            --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" \
            --sdk-version '${{ fromJSON(needs.validate.outputs.sdk_versions)[0] }}' \
            --source-revision "$GITHUB_SHA" \
            --output dist/manifest.v0.json --notes-output "$RUNNER_TEMP/release-notes.md"
          cd dist
          sha256sum hapup.sh > hapup.sh.sha256
          sha256sum manifest.v0.json > manifest.v0.json.sha256
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sdk='${{ fromJSON(needs.validate.outputs.sdk_versions)[0] }}'
          latest=true
          if [[ "$sdk" == 1.0.5 ]]; then latest=false; fi
          title="HapCLI ${{ needs.validate.outputs.version }} — Cangjie $sdk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            printf 'release already exists; refusing to overwrite published assets\n' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest="$latest" \
            --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md"
