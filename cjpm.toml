[package]
  cjc-version = "1.1.0"
  name = "hapcli"
  description = "HapCLI flagship open-source core seed"
  version = "0.3.0"
  license = "Apache-2.0"
  output-type = "executable"
  src-dir = "src"
  compile-option = "-Woff unused -Woff driver-arg"
  include = ["src", "README.md", "README.zh-CN.md", "README.ru.md", "LICENSE", "NOTICE", "docs", "contracts", "examples", "release"]

[dependencies]

[target.aarch64-linux-ohos]
  compile-option = "--static --static-std -B \"${OHOS_SDK_NATIVE}/sysroot/usr/lib/aarch64-linux-ohos\" -L \"${OHOS_SDK_NATIVE}/sysroot/usr/lib/aarch64-linux-ohos\" --sysroot \"${OHOS_SDK_NATIVE}/sysroot\""

[target.x86_64-linux-ohos]
  compile-option = "--static --static-std -B \"${OHOS_SDK_NATIVE}/sysroot/usr/lib/x86_64-linux-ohos\" -L \"${OHOS_SDK_NATIVE}/sysroot/usr/lib/x86_64-linux-ohos\" --sysroot \"${OHOS_SDK_NATIVE}/sysroot\""

[target.aarch64-apple-darwin]
  compile-option = "--static --static-std --link-options -headerpad_max_install_names"

[target.x86_64-apple-darwin]
  compile-option = "--static --static-std --link-options -headerpad_max_install_names"

[target.x86_64-unknown-linux-gnu]
  compile-option = "--static --static-std"

[target.aarch64-unknown-linux-gnu]
  compile-option = "--static --static-std"

# Cangjie 1.1.3 Windows static unittest binaries crash before their test bodies.
# Use the supported dynamic standard library and ship its DLLs with hap.exe.
[target.x86_64-w64-mingw32]
  compile-option = "--dy-std"
