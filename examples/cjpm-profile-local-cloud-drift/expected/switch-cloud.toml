[package]
name = "hap_fixture_local_cloud_drift"
version = "0.1.0"
cjc-version = "1.1.3"
output-type = "executable"

[dependencies]
WebRuntime = { git = "https://gitcode.com/example/web-runtime-cangjie.git", branch = "main" }
CryptoContract = { git = "https://gitcode.com/example/crypto-contract.git", tag = "v0.1.0" }
JsonLib = { git = "https://gitcode.com/example/json-lib-cangjie.git", branch = "main" }

[tool.hap.profile]
current = "cloud"
reason = "cloud build uses remote dependencies"

[tool.hap.stdx]
expected = "stdx_Build/linux_x86_64_cjnative"
allow_temporary_repair = true

[tool.hap.runtime]
expected_channel = "cangjie-sdk-linux-x86_64-1.1.3"
install_policy = "diagnose-only"
